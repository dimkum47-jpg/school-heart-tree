<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="마음나무" />
  <meta name="description" content="책을 읽고 친구를 칭찬하며 함께 키워가는 우리 학교의 마음나무" />
  <title>우리 학교 마음나무</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./assets/icon192.png" />
  <link rel="apple-touch-icon" href="./assets/icon192.png" />
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <button class="brand" type="button" data-nav="home" aria-label="마음나무 메인으로">
        <span class="brand-symbol" aria-hidden="true">🌳</span>
        <span class="brand-text"><strong>우리 학교 마음나무</strong><small>읽고, 칭찬하고, 함께 자라요</small></span>
      </button>
      <button class="small-button outline hidden" id="logoutButton" type="button">로그아웃</button>
    </header>
    <nav class="top-nav" aria-label="주요 메뉴">
      <button type="button" class="nav-button active" data-nav="home">🌳 마음나무</button>
      <button type="button" class="nav-button" data-nav="student">📖 내 기록장</button>
      <button type="button" class="nav-button" data-nav="officer">✅ 임원 관리</button>
      <button type="button" class="nav-button" data-nav="admin">⚙️ 교사 관리</button>
    </nav>
    <div id="serviceBanner" class="notice hidden" role="status"></div>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">하나의 독서, 하나의 칭찬이 우리 학교의 열매가 됩니다.<span> · 학교 캠페인 전용</span></footer>
  </div>
  <dialog id="fruitDialog" class="fruit-dialog" aria-labelledby="fruitDialogTitle">
    <div class="dialog-inner">
      <button id="closeFruit" type="button" class="close-dialog" aria-label="닫기">×</button>
      <p id="fruitDialogType" class="eyebrow"></p>
      <h2 id="fruitDialogTitle">마음나무의 열매</h2>
      <p id="fruitDialogContent" class="dialog-text"></p>
      <p class="muted small">이름을 공개하지 않는 승인된 기록입니다.</p>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
